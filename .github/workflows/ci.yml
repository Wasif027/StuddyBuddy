name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ekdp
          POSTGRES_USER: ekdp
          POSTGRES_PASSWORD: ekdp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ekdp" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ekdp:ekdp@localhost:5432/ekdp
      REDIS_URL: redis://localhost:6379/0
      SEED_ON_STARTUP: "false"
      OTEL_CONSOLE_EXPORT: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: python -m pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Boot the stack and probe health
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null; then echo "backend up"; break; fi
            sleep 3
          done
          curl -fsS http://localhost:8000/health | tee /dev/stderr | grep -q '"postgres":"up"'
          curl -fsS http://localhost:3000 >/dev/null && echo "frontend up"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
