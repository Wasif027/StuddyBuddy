# =============================================================================
# OpenTelemetry Collector — EKDP (dev profile)
# Receives OTLP from the backend, prints to stdout, exposes a Prometheus
# scrape endpoint. Add jaeger/tempo/datadog exporters for production.
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_max_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

exporters:
  debug:
    verbosity: normal
    sampling_initial: 5
    sampling_thereafter: 200
  prometheus:
    endpoint: 0.0.0.0:8889

  # --- Production examples (uncomment + configure) ---------------------------
  # otlp/tempo:
  #   endpoint: tempo:4317
  #   tls: { insecure: true }
  # datadog:
  #   api: { key: ${env:DD_API_KEY} }

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
